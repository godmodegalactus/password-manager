[package]
name = "pwmgr"
version = "0.1.0"
edition = "2021"
description = "Deterministic password manager backed by a Ledger hardware wallet running the Solana app"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
hkdf = "0.12"
sha2 = "0.10"
directories = "5"
arboard = { version = "3", default-features = false }
zeroize = { version = "1", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
console = "0.15"

[profile.release]
lto = "thin"
strip = true
